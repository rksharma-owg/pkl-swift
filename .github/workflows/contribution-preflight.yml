name: Pkl contribution preflight
on:
  workflow_dispatch:
    inputs:
      code_sha:
        description: Exact contribution commit
        required: true
        type: string
      base_sha:
        description: Exact upstream baseline
        required: true
        type: string
permissions:
  contents: read
jobs:
  test-pkl-0-25-3:
    name: Test Pkl 0.25.3
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
        ref: ${{ inputs.code_sha }}
        fetch-depth: 0
    - name: Verify tested commit
      env:
        EXPECTED_SHA: ${{ inputs.code_sha }}
        BASE_SHA: ${{ inputs.base_sha }}
      run: |
        git config --global --add safe.directory "$PWD"
        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        git merge-base --is-ancestor "$BASE_SHA" HEAD
        git show -s --format='%H %s'
    - name: Setup Pkl
      id: setup-pkl
      env:
        PKL_VERSION: 0.25.3
        PKL_FILENAME: pkl
        PKL_DOWNLOAD_URL: https://github.com/apple/pkl/releases/download/0.25.3/pkl-linux-amd64
      shell: bash
      run: |-
        DIR="$(mktemp -d /tmp/pkl-$PKL_VERSION-XXXXXX)"
        PKL_EXEC="$DIR/$PKL_FILENAME"
        curl -sfL -o $PKL_EXEC "$PKL_DOWNLOAD_URL"
        chmod +x $PKL_EXEC
        echo "$DIR" >> "$GITHUB_PATH"
        echo "pkl_exec=$PKL_EXEC" >> "$GITHUB_OUTPUT"
    - name: swift test
      run: |-
        mkdir -p .out/test-results/
        swift test -vv --parallel --num-workers 1 --xunit-output .out/test-results/xunit.xml -Xswiftc -warnings-as-errors
    - name: Upload Test Result XML
      if: '!cancelled()'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      with:
        name: test-results-xml-test-pkl-0-25-3
        path: .out/test-results/**/*.xml
        if-no-files-found: ignore
    container:
      image: swift:6.1-rhel-ubi9
